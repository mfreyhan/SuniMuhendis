name: tests

on:
  push:
  pull_request:

jobs:
  python-312:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/python312.txt
      - name: Install development environment
        run: python -m pip install -c constraints/python312.txt -r requirements.txt -e .
      - name: Verify dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate wheel boundary and runtime metadata
        run: python scripts/check_wheel_metadata.py dist
      - name: Smoke-test wheel in a clean consumer environment
        run: python scripts/check_wheel_consumer.py dist
